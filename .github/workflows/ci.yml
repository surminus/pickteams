name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the checks
        run: make check

      # Building every platform on a pull request means a release tag cannot be
      # the first time a cross-compile is tried.
      - name: Build the binaries
        run: make dist
