# Actions are pinned to a commit SHA rather than a tag, because a tag can be
# moved to point at different code. The comment after each one is the version
# that SHA was, so an upgrade is still a readable diff.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the checks
        run: make check

      # Building every platform on a pull request means a release tag cannot be
      # the first time a cross-compile is tried.
      - name: Build the binaries
        run: make dist
