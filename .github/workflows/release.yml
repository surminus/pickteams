# Actions are pinned to a commit SHA rather than a tag, because a tag can be
# moved to point at different code. The comment after each one is the version
# that SHA was, so an upgrade is still a readable diff.

name: release

# Pushing a tag like v1.2.3 is the whole release process. Nothing here runs on
# a normal push, so an ordinary commit cannot publish anything by accident.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags, and a shallow clone does not have them.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the checks
        run: make check

      - name: Build the binaries
        run: make dist VERSION=${{ github.ref_name }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
